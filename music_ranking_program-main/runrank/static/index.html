
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RS music app</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f0f12">

  <style>
    :root{
      --bg:#0b0b0f;
      --device:#e9e9ee;
      --device2:#d7d7de;
      --shadow: rgba(0,0,0,.35);
      --screen:#0f1620;
      --screen2:#121b27;
      --text:#eaf0ff;
      --muted:#9db0d1;
      --accent:#7bdcff;
      --line: rgba(255,255,255,.12);
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", Helvetica, Arial, sans-serif;
    }
    html,body{height:100%; margin:0; background: radial-gradient(1200px 800px at 70% 20%, #1a2b3a 0%, var(--bg) 55%, #06060a 100%); color:var(--text); font-family:var(--font);}
    *{box-sizing:border-box;}
    a{color:inherit}

    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:26px 18px;}
    .ipod{width:min(360px, 92vw);aspect-ratio:9/14;border-radius:36px;background:linear-gradient(180deg,var(--device) 0%,var(--device2) 100%);box-shadow:0 24px 70px var(--shadow);padding:18px 16px 20px;position:relative;}
    .ipod:before{content:"";position:absolute;inset:10px 10px auto 10px;height:20px;border-radius:16px;background:rgba(255,255,255,.35);filter:blur(.2px);}

    .screen{height:40%;border-radius:12px;background:linear-gradient(180deg,var(--screen2),var(--screen));border:1px solid rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);padding:10px 10px 12px;overflow:hidden;position:relative;}
    .status{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.2px;padding:2px 2px 6px;}
    .status .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);color:var(--muted);}

    .view{height:calc(100% - 26px);display:flex;flex-direction:column;gap:8px;}
    .titleRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;}
    .titleRow h1{margin:0;font-size:14px;font-weight:800;letter-spacing:.4px;}
    .titleRow .hint{font-size:11px;color:var(--muted);}

    .list{flex:1;overflow:auto;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);padding:6px;-webkit-overflow-scrolling:touch;}
    .item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;cursor:default;user-select:none;}
    .item + .item{margin-top:6px;}
    .item .thumb{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);overflow:hidden;flex:0 0 auto;display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:12px;}
    .item .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .item .meta{min-width:0;}
    .item .meta .name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
    .item .meta .sub{margin-top:2px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
    .item .right{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
    .item.active{background:rgba(123,220,255,.16);border:1px solid rgba(123,220,255,.30);}
    .item.active .right{color:var(--text);}

    .detail{
      display:flex; flex-direction:column; gap:10px;
      border-radius:10px; border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      padding:10px; height:100%;
      overflow:auto; -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain; padding-bottom:22px;
    }

    input{
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.12);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 10px;
      outline: none;
      font-size: 12px;
    }

    .cta{display:flex;gap:8px;flex-wrap:wrap;}
    .btn{
      border:1px solid rgba(0,0,0,.18);
      background: rgba(255,255,255,.18);
      color: rgba(10,10,14,.88);
      border-radius: 999px;
      padding: 9px 12px;
      font-weight: 900;
      font-size: 12px;
      cursor:pointer;
      user-select:none;
    }
    .btn.primary{background: rgba(123,220,255,.40);}
    .btn:active{transform: translateY(1px);}

    .wheelWrap{height:60%;display:flex;align-items:center;justify-content:center;padding-top:14px;}
    .wheel{
      width:82%; aspect-ratio:1/1; border-radius:999px;
      background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.65),rgba(255,255,255,.22) 35%,rgba(0,0,0,.05) 66%,rgba(0,0,0,.10) 100%);
      border:1px solid rgba(0,0,0,.20);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 28px rgba(0,0,0,.16);
      position:relative;
      user-select:none;
      touch-action:none;
    }
    .wheel .center{
      position:absolute; inset:30%; border-radius:999px;
      background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.20) 60%,rgba(0,0,0,.06) 100%);
      border:1px solid rgba(0,0,0,.20);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
      display:grid; place-items:center;
      font-weight:900; color:rgba(20,20,24,.65);
      cursor:pointer;
    }
    .wheelBtn{position:absolute;display:grid;place-items:center;width:36%;height:20%;font-size:12px;font-weight:900;color:rgba(20,20,24,.65);cursor:pointer;}
    .wheelBtn.top{top:4%;left:32%;}
    .wheelBtn.bottom{bottom:4%;left:32%;}
    .wheelBtn.left{left:4%;top:40%;}
    .wheelBtn.right{right:4%;top:40%;}
    .wheelBtn small{opacity:.9}

    .toast{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background: rgba(0,0,0,.72);
      border:1px solid rgba(255,255,255,.12);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      width: min(340px, 92vw);
      box-shadow: 0 14px 36px rgba(0,0,0,.35);
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.on{opacity:1; transform:translateX(-50%) translateY(-2px);}
    .toast .t{font-weight:900;font-size:12px;}
    .toast .s{margin-top:2px;font-size:11px;color:rgba(255,255,255,.72);}

    .kbd{font-size:11px;color:var(--muted);line-height:1.4;padding:0 2px;}
    code{
      background: rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.10);
      border-radius:8px;
      padding: 1px 6px;
      margin:0 2px;
      color: rgba(255,255,255,.85);
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="ipod">
      <div class="screen">
        <div class="status">
          <div id="clock">--:--</div>
          <div class="pill" id="pillState">ONLINE</div>
        </div>
        <div class="view" id="view"></div>
      </div>

      <div class="wheelWrap">
        <div class="wheel" id="wheel">
          <div class="wheelBtn top" id="btnMenu"><small>MENU</small></div>
          <div class="wheelBtn left" id="btnPrev" aria-label="Previous">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 5h2v14H6zM20 6v12l-10-6z"/></svg>
          </div>
          <div class="wheelBtn right" id="btnNext" aria-label="Next">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M16 5h2v14h-2zM4 6v12l10-6z"/></svg>
          </div>
          <div class="wheelBtn bottom" id="btnCheck" aria-label="Check">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path>
            </svg>
          </div>
          <div class="center" id="btnCenter">OK</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="t" id="toastTitle">—</div>
    <div class="s" id="toastSub">—</div>
  </div>

<script>
(() => {
  // SW 등록
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('/service-worker.js');
        try { await reg.update(); } catch (_) {}
      } catch (_) {}
    });
  }

  const state = {
    page: 'menu',
    menuIndex: 0,
    listIndex: 0,
    tracks: [],
    ranking: [],
    hot: [],
    runs: [],
    selectedTrack: null,
    selectedRun: null,
    checkedTrackIds: new Set(),
    online: true,
    voteArmed: false,
    _detailTrackId: null,
    _shareRunText: null,
  };

  const MENU = [
    { key: 'tracks',   label: 'Tracks',   hint: '곡 목록 / 체크' },
    { key: 'ranking',  label: 'Ranking',  hint: '전체 랭킹' },
    { key: 'hot',      label: 'Hot',      hint: '최근 인기' },
    { key: 'runs',     label: 'Runs',     hint: '런닝 기록' },
    { key: 'settings', label: 'Settings', hint: '닉네임' },
    { key: 'about',    label: 'About',    hint: '설명' },
  ];

  const el = {
    view: document.getElementById('view'),
    toast: document.getElementById('toast'),
    toastTitle: document.getElementById('toastTitle'),
    toastSub: document.getElementById('toastSub'),
    pill: document.getElementById('pillState'),
    clock: document.getElementById('clock'),
    wheel: document.getElementById('wheel'),
    btnMenu: document.getElementById('btnMenu'),
    btnPrev: document.getElementById('btnPrev'),
    btnNext: document.getElementById('btnNext'),
    btnCheck: document.getElementById('btnCheck'),
    btnCenter: document.getElementById('btnCenter'),
  };

  function fmtClock(d = new Date()) {
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${hh}:${mm}`;
  }

  let toastTimer = null;
  function showToast(title, sub = '') {
    clearTimeout(toastTimer);
    el.toastTitle.textContent = title;
    el.toastSub.textContent = sub;
    el.toast.classList.add('on');
    toastTimer = setTimeout(() => el.toast.classList.remove('on'), 1600);
  }

  function safeText(s) { return (s ?? '').toString(); }
  function escapeHtml(s) {
    return safeText(s).replace(/[&<>"']/g, (ch) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

  function getNick() { return localStorage.getItem('runrank_nick') || ''; }
  function setNick(v) { localStorage.setItem('runrank_nick', v); }

  function pickCoverUrl(x) { return x?.cover_url || x?.album_art || x?.image_url || ''; }

  async function apiGet(path) {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status}`);
    return await res.json();
  }

  async function checkOnline() {
    try {
      const res = await fetch('/api/health', { cache: 'no-store' });
      state.online = !!res.ok;
    } catch {
      state.online = false;
    }
    el.pill.textContent = state.online ? 'ONLINE' : 'OFFLINE';
    el.pill.style.opacity = state.online ? '1' : '0.75';
  }
  function startOnlineMonitor() { checkOnline(); setInterval(checkOnline, 15000); }

  // ✅ 커버 포함: 서버에서 resolve_missing으로 채워오기
  async function refreshAll() {
    try {
      const [tracks, ranking, hot] = await Promise.all([
        apiGet('/api/tracks?resolve_missing=1&resolve_limit=50'),
        apiGet('/api/ranking'),
        apiGet('/api/hot_ranking'),
      ]);
      state.tracks = Array.isArray(tracks) ? tracks : (tracks?.tracks || []);
      state.ranking = Array.isArray(ranking) ? ranking : (ranking?.ranking || []);
      state.hot = Array.isArray(hot) ? hot : (hot?.ranking || []);
      state.online = true;
      render();
    } catch (e) {
      showToast('오프라인', '네트워크를 확인해줘');
      state.online = false;
      render();
    }
  }

  async function refreshRuns() {
    try {
      const nick = getNick();
      const qs = nick ? `?user=${encodeURIComponent(nick)}` : '';
      const runs = await apiGet('/api/runs' + qs);
      state.runs = Array.isArray(runs) ? runs : [];
      render();
    } catch (e) {
      showToast('Runs 실패', '서버 응답이 이상해');
    }
  }

  function clampIndex(i, n) { if (n <= 0) return 0; return (i % n + n) % n; }

  function renderHeader(title, hint) {
    return `<div class="titleRow"><h1>${title}</h1><div class="hint">${hint || ''}</div></div>`;
  }

  function ensureActiveInView() {
    const list = el.view.querySelector('.list');
    const active = el.view.querySelector('.item.active');
    if (!list || !active) return;
    try { active.scrollIntoView({ block: 'nearest' }); } catch (_) {}
  }

  function normalizeRankingItem(x) {
    const title = safeText(x?.title || x?.track || x?.name || x?.[0] || '');
    const score = x?.votes ?? x?.score ?? x?.count ?? x?.[1] ?? '';
    const artist = safeText(x?.artist || x?.by || x?.[2] || '');
    const cover_url = pickCoverUrl(x);
    return { title, artist, score, cover_url };
  }

  function fmtDur(sec) {
    sec = Number(sec || 0);
    const m = Math.floor(sec / 60);
    const s = sec - m * 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  // ===== 투표(여러 곡 가능) =====
  async function submitMulti(trackIds) {
    try {
      const user = (getNick() || '').trim();
      if (!user) { showToast('투표', 'Settings에서 닉네임 먼저 저장'); return; }

      const uniq = Array.from(new Set((trackIds || []).map(x => Number(x)).filter(x => Number.isFinite(x))));
      if (!uniq.length) { showToast('투표', '투표할 곡이 없어'); return; }

      const body = { user, track_ids: uniq };
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data?.ok === false) throw new Error(data?.error || `${res.status}`);

      showToast('투표 완료', `총 ${uniq.length}곡`);
      // 랭킹 갱신
      const [ranking, hot] = await Promise.all([
        apiGet('/api/ranking'),
        apiGet('/api/hot_ranking'),
      ]);
      state.ranking = Array.isArray(ranking) ? ranking : (ranking?.ranking || []);
      state.hot = Array.isArray(hot) ? hot : (hot?.ranking || []);
      render();
    } catch (e) {
      showToast('투표 실패', String(e.message || e).slice(0, 80));
    }
  }

  // ===== 화면 렌더 =====
  function render() {
    el.pill.textContent = state.online ? 'ONLINE' : 'OFFLINE';
    el.pill.style.opacity = state.online ? '1' : '0.75';

    if (state.page === 'detail') return renderTrackDetail();
    if (state.page === 'run_create') return renderRunCreate();
    if (state.page === 'run_detail') return renderRunDetail();
    if (state.page === 'menu') return renderMenu();
    if (state.page === 'tracks') return renderTracks();
    if (state.page === 'ranking') return renderRanking();
    if (state.page === 'hot') return renderHot();
    if (state.page === 'runs') return renderRuns();
    if (state.page === 'settings') return renderSettings();
    if (state.page === 'about') return renderAbout();

    state.page = 'menu';
    renderMenu();
  }

  function renderMenu() {
    state.menuIndex = clampIndex(state.menuIndex, MENU.length);
    const items = MENU.map((m, idx) => `
      <div class="item ${idx === state.menuIndex ? 'active' : ''}">
        <div class="thumb">⌁</div>
        <div class="meta"><div class="name">${m.label}</div><div class="sub">${m.hint}</div></div>
        <div class="right">›</div>
      </div>
    `).join('');

    el.view.innerHTML = `
      ${renderHeader('RS music app', 'iPod UI')}
      <div class="list">${items}</div>
      <div class="kbd">조작: <code>휠</code> 이동 · <code>OK</code> 선택 · <code>CHECK</code> 곡 체크</div>
    `;
    requestAnimationFrame(ensureActiveInView);
  }

  function renderTracks() {
    const list = state.tracks || [];
    state.listIndex = clampIndex(state.listIndex, list.length);

    const items = list.map((t, idx) => {
      const cover = pickCoverUrl(t);
      const name = safeText(t.title || t.name || t.track || `Track ${t.id ?? ''}`);
      const artist = safeText(t.artist || t.singer || t.by || '');
      const checked = state.checkedTrackIds.has(Number(t.id));
      return `
        <div class="item ${idx === state.listIndex ? 'active' : ''}">
          <div class="thumb">${cover ? `<img alt="" src="${cover}" onerror="this.remove()">` : '♪'}</div>
          <div class="meta"><div class="name">${escapeHtml(name)}</div><div class="sub">${escapeHtml(artist || ' ')}</div></div>
          <div class="right">${checked ? '✓' : '+'}</div>
        </div>
      `;
    }).join('');

    el.view.innerHTML = `
      ${renderHeader('Tracks', 'OK=상세')}
      <div class="list">${items || '<div class="item"><div class="thumb">!</div><div class="meta"><div class="name">트랙이 없어</div><div class="sub">/api/tracks 확인</div></div></div>'}</div>
      <div class="kbd"><code>OK</code> 상세 · <code>CHECK</code> 체크/해제 · (체크한 곡들은 투표 묶음에 사용됨)</div>
    `;
    requestAnimationFrame(ensureActiveInView);
  }

  function renderRanking() {
    const list = (state.ranking || []).map(normalizeRankingItem);
    state.listIndex = clampIndex(state.listIndex, list.length);

    const items = list.map((r, idx) => `
      <div class="item ${idx === state.listIndex ? 'active' : ''}">
        <div class="thumb">${r.cover_url ? `<img alt="" src="${r.cover_url}" onerror="this.remove()">` : String(idx + 1)}</div>
        <div class="meta"><div class="name">${escapeHtml(r.title || '—')}</div><div class="sub">${escapeHtml(r.artist || ' ')}</div></div>
        <div class="right">${escapeHtml(String(r.score))}</div>
      </div>
    `).join('');

    el.view.innerHTML = `
      ${renderHeader('Ranking', '전체')}
      <div class="list">${items || '<div class="item"><div class="thumb">…</div><div class="meta"><div class="name">데이터 없음</div><div class="sub">투표를 먼저 해봐</div></div></div>'}</div>
      <div class="kbd"><code>MENU</code> 홈</div>
    `;
    requestAnimationFrame(ensureActiveInView);
  }

  function renderHot() {
    const list = (state.hot || []).map(normalizeRankingItem);
    state.listIndex = clampIndex(state.listIndex, list.length);

    const items = list.map((r, idx) => `
      <div class="item ${idx === state.listIndex ? 'active' : ''}">
        <div class="thumb">${r.cover_url ? `<img alt="" src="${r.cover_url}" onerror="this.remove()">` : '🔥'}</div>
        <div class="meta"><div class="name">${escapeHtml(r.title || '—')}</div><div class="sub">${escapeHtml(r.artist || ' ')}</div></div>
        <div class="right">${escapeHtml(String(r.score))}</div>
      </div>
    `).join('');

    el.view.innerHTML = `
      ${renderHeader('Hot', '최근')}
      <div class="list">${items || '<div class="item"><div class="thumb">…</div><div class="meta"><div class="name">데이터 없음</div><div class="sub">최근 투표가 없어</div></div></div>'}</div>
      <div class="kbd"><code>MENU</code> 홈</div>
    `;
    requestAnimationFrame(ensureActiveInView);
  }

  function renderRuns() {
    const runs = state.runs || [];
    state.listIndex = clampIndex(state.listIndex, runs.length);

    const items = runs.map((r, idx) => {
          const photo = r.photo_url;
      const bust = r.ts_epoch || r.id || Date.now();
      const thumbHtml = photo
        ? `<img src="${escapeAttr(photo)}?v=${bust}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:12px;display:block;" />`
        : `<div style="width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);">🏃</div>`;

      
      const sub = `${r.date_label} · ${r.distance_km}km · ${fmtDur(r.duration_sec)} · ${r.pace}`;
      return `
        <div class="item ${idx === state.listIndex ? 'active' : ''}">
          <div class="thumb">${thumbHtml}</div>
          <div class="meta"><div class="name">${escapeHtml(r.date_label || 'Run')}</div><div class="sub">${escapeHtml(sub)}</div></div>
          <div class="right">›</div>
        </div>
      `;
    }).join('');

    el.view.innerHTML = `
      ${renderHeader('Runs', 'OK=작성')}
      <div class="list">${items || '<div class="item"><div class="thumb">🏃</div><div class="meta"><div class="name">기록 없음</div><div class="sub">OK 눌러서 기록 만들기</div></div></div>'}</div>
      <div class="kbd"><code>OK</code> 기록 작성 · <code>MENU</code> 홈</div>
    `;
    requestAnimationFrame(ensureActiveInView);
  }

  function renderSettings() {
    const nick = getNick();
    el.view.innerHTML = `
      ${renderHeader('Settings', '닉네임')}
      <div class="detail">
        <div style="display:flex; gap:8px; align-items:center;">
          <input id="nickInput" value="${escapeAttr(nick)}" placeholder="예) joon" style="flex:1;">
          <button class="btn primary" id="saveNick">저장</button>
        </div>
        <div class="cta">
          <button class="btn" id="refreshBtn">새로고침</button>

  // ===== Runs 작성/공유 =====
   function parseHMS(s) {
    s = String(s || '').trim();
    if (!s) return NaN;

    const parts = s.split(':').map(x => x.trim());
    if (parts.some(p => p === '' || isNaN(Number(p)))) return NaN;

    if (parts.length === 2) {
      const mm = Number(parts[0]);
      const ss = Number(parts[1]);
      if (mm < 0 || ss < 0 || ss >= 60) return NaN;
      return Math.round(mm * 60 + ss);
    }

    if (parts.length === 3) {
      const hh = Number(parts[0]);
      const mm = Number(parts[1]);
      const ss = Number(parts[2]);
      if (hh < 0 || mm < 0 || ss < 0 || mm >= 60 || ss >= 60) return NaN;
      return Math.round(hh * 3600 + mm * 60 + ss);
    }

    return NaN;
  }

  async function submitRunCreate() {
    const nick = getNick().trim();
    if (!nick) { showToast('Runs', 'Settings에서 닉네임 먼저 저장해'); return; }

    const date_label = document.getElementById('runDate')?.value?.trim() || '';
    const distance_km = parseFloat(document.getElementById('runDist')?.value || '');
    const duration_sec = parseHMS(document.getElementById('runDur')?.value || '');
    const photo = document.getElementById('runPhoto')?.files?.[0] || null;

    if (!date_label) { showToast('Runs', '날짜를 입력해'); return; }
    if (!Number.isFinite(distance_km) || distance_km <= 0) { showToast('Runs', '거리(km)를 제대로 입력해'); return; }
    if (!Number.isFinite(duration_sec) || duration_sec <= 0) { showToast('Runs', '시간을 hh:mm:ss 또는 mm:ss로 입력해'); return; }


    const fd = new FormData();
    fd.append('user', nick);
    fd.append('distance_km', String(distance_km));
    fd.append('duration_sec', String(duration_sec));
    fd.append('date_label', date_label);

    const checked = Array.from(state.checkedTrackIds || []);
    if (checked.length) fd.append('track_ids', checked.join(','));
    if (photo) fd.append('photo', photo);

    try {
      const res = await fetch('/api/runs', { method:'POST', body: fd });
      const data = await res.json().catch(()=> ({}));
      if (!res.ok || data?.ok === false) throw new Error(data?.error || String(res.status));

      showToast('Runs', '저장 완료');

      state.selectedRun = {
        id: data.id,
        user: nick,
        date_label,
        distance_km,
        duration_sec,
        pace: data.pace || '',
        photo_url: data.photo_url || null,
      };

      state.page = 'run_detail';
      await refreshRuns();
      render();
    } catch (e) {
      showToast('Runs 실패', String(e.message || e).slice(0,80));
    }
  }

  async function shareRunText(text) {
    const payload = { title: 'RS music app 기록', text: text };
    if (navigator.share) {
      try { await navigator.share(payload); return; } catch (_) {}
    }
    try {
      await navigator.clipboard.writeText(text);
      showToast('공유', '텍스트 복사됨 (카톡에 붙여넣기)');
    } catch (_) {
      alert(text);
    }
  }

  async function shareRunImage(run, aspect = 'story') {
    if (!run?.id) return;
    const url = `/api/runs/${encodeURIComponent(run.id)}/share.png?aspect=${encodeURIComponent(aspect)}&_=${Date.now()}`;
    try {
      const res = await fetch(url, { cache: 'no-store' });
      const blob = await res.blob();
      if (!res.ok || !blob || blob.size < 1000) throw new Error('이미지 생성 실패');

      const file = new File([blob], `run_${run.id}.png`, { type: 'image/png' });

      // Web Share (files) 지원 시: 카톡/인스타로 바로 공유 가능
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        try {
          await navigator.share({
            title: 'RS music app 기록',
            text: '🏃 Run 기록',
            files: [file],
          });
          return;
        } catch (_) {}
      }

      // Fallback: 다운로드/미리보기
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = `run_${run.id}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objUrl), 8000);
      showToast('공유', '이미지 다운로드됨 (갤러리/파일에서 공유)');
    } catch (e) {
      showToast('공유 실패', String(e?.message || e).slice(0, 80));
    }
  }

  // ===== 네비게이션/입력 =====
  function goMenu(){ state.voteArmed=false; state.page='menu'; render(); }
  function goBack(){
    if (state.page === 'detail') { state.voteArmed=false; state.page='tracks'; return render(); }
    if (state.page === 'run_create') { state.page='runs'; return render(); }
    if (state.page === 'run_detail') { state.page='runs'; return render(); }
    state.page = 'menu'; render();
  }

  function moveUp(){ if (state.page === 'menu') state.menuIndex--; else state.listIndex--; render(); }
  function moveDown(){ if (state.page === 'menu') state.menuIndex++; else state.listIndex++; render(); }

  function select(){
    // Track 상세: 투표 실행 (☑일 때만)
    if (state.page === 'detail') {
      const tid = state._detailTrackId;
      if (!tid) { showToast('투표', '트랙 정보가 없어'); return; }
      if (!state.voteArmed) { showToast('투표', '체크(☐) 후 OK'); return; }

      // ✅ 2번: 여러 곡 투표 = (체크한 곡들 + 현재 상세곡) 한 번에 track_ids로 전송
      const ids = new Set(Array.from(state.checkedTrackIds || []));
      ids.add(Number(tid));
      state.voteArmed = false;
      submitMulti(Array.from(ids));
      return;
    }

    // Run 상세: 공유
    if (state.page === 'run_detail') {
      // OK는 이미지 공유 우선
      if (state.selectedRun) shareRunImage(state.selectedRun, 'story');
      return;
    }

    // Run 작성: 저장
    if (state.page === 'run_create') {
      submitRunCreate();
      return;
    }

    // Menu -> page
    if (state.page === 'menu'){
      const key = MENU[clampIndex(state.menuIndex, MENU.length)]?.key;
      if (key === 'runs') { state.page='runs'; refreshRuns(); return; }
      state.page = key || 'tracks';
      state.listIndex = 0;
      render();
      return;
    }

    // Tracks -> detail
    if (state.page === 'tracks'){
      const list = state.tracks || [];
      const t = list[clampIndex(state.listIndex, list.length)];
      if (!t) return;
      state.selectedTrack = t;
      state.voteArmed = false;
      state.page = 'detail';
      render();
      return;
    }

    // Runs -> create
    if (state.page === 'runs'){
      state.page = 'run_create';
      render();
      return;
    }
  }

  function toggleCheck() {
    // ✅ CHECK 버튼 = 트랙 체크/해제
    let id = null;
    if (state.page === 'tracks') {
      const list = state.tracks || [];
      const t = list[clampIndex(state.listIndex, list.length)];
      id = t?.id ?? t?.track_id ?? t?.trackId;
    } else if (state.page === 'detail') {
      id = state.selectedTrack?.id ?? state.selectedTrack?.track_id ?? state.selectedTrack?.trackId;
    }
    if (id == null) return;
    id = Number(id);
    if (state.checkedTrackIds.has(id)) {
      state.checkedTrackIds.delete(id);
      showToast('해제', `체크 ${state.checkedTrackIds.size}개`);
    } else {
      state.checkedTrackIds.add(id);
      showToast('체크', `체크 ${state.checkedTrackIds.size}개`);
    }
    render();
  }

  // ===== (1) 휠 회전: pointer + touch 둘 다 지원 =====
  function bindWheelRotation() {
    const wheel = el.wheel;
    if (!wheel || wheel.dataset.bound === '1') return;
    wheel.dataset.bound = '1';

    const STEP_DEG = 22;
    let dragging = false;
    let lastAngle = 0;
    let accum = 0;

    function getPoint(ev){
      if (ev.touches && ev.touches[0]) return ev.touches[0];
      return ev;
    }

    function angleFromEvent(ev) {
      const p = getPoint(ev);
      const r = wheel.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const x = p.clientX - cx;
      const y = p.clientY - cy;
      let a = Math.atan2(y, x) * 180 / Math.PI;
      if (a < 0) a += 360;
      return a;
    }

    function isOnOuterRing(ev) {
      const p = getPoint(ev);
      const r = wheel.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = p.clientX - cx;
      const dy = p.clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const outer = r.width / 2;
      const inner = outer * 0.33;
      return dist <= outer && dist >= inner;
    }

    function rotateStep(dir) {
      if (state.page === 'menu') {
        state.menuIndex = clampIndex(state.menuIndex + dir, MENU.length);
        render(); return;
      }
      const listLen =
        state.page === 'tracks' ? (state.tracks || []).length :
        state.page === 'ranking' ? (state.ranking || []).length :
        state.page === 'hot' ? (state.hot || []).length :
        state.page === 'runs' ? (state.runs || []).length : 0;

      if (listLen > 0) {
        state.listIndex = clampIndex(state.listIndex + dir, listLen);
        render();
      }
    }

    // 버튼/센터는 회전 드래그 대상에서 제외
    function isButtonTarget(ev){
      const t = ev.target;
      if (!t || !t.closest) return false;
      return !!t.closest('#btnCenter, #btnMenu, #btnPrev, #btnNext, #btnCheck, .wheelBtn, .center');
    }

    // pointer
    wheel.addEventListener('pointerdown', (ev) => {
      if (isButtonTarget(ev)) return;
      if (!isOnOuterRing(ev)) return;
      ev.preventDefault();
      dragging = true;
      lastAngle = angleFromEvent(ev);
      accum = 0;
      try { wheel.setPointerCapture(ev.pointerId); } catch (_) {}
    });

    wheel.addEventListener('pointermove', (ev) => {
      if (!dragging) return;
      if (!isOnOuterRing(ev)) return;
      const a = angleFromEvent(ev);
      let delta = a - lastAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      lastAngle = a;
      accum += delta;
      while (accum >= STEP_DEG) { rotateStep(+1); accum -= STEP_DEG; }
      while (accum <= -STEP_DEG) { rotateStep(-1); accum += STEP_DEG; }
      ev.preventDefault();
    });

    wheel.addEventListener('pointerup', () => { dragging = false; });
    wheel.addEventListener('pointercancel', () => { dragging = false; });

    // touch fallback (iOS에서 pointer가 죽는 케이스 대비)
    wheel.addEventListener('touchstart', (ev) => {
      if (isButtonTarget(ev)) return;
      if (!isOnOuterRing(ev)) return;
      dragging = true;
      lastAngle = angleFromEvent(ev);
      accum = 0;
      ev.preventDefault();
    }, {passive:false});

    wheel.addEventListener('touchmove', (ev) => {
      if (!dragging) return;
      if (!isOnOuterRing(ev)) return;
      const a = angleFromEvent(ev);
      let delta = a - lastAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      lastAngle = a;
      accum += delta;
      while (accum >= STEP_DEG) { rotateStep(+1); accum -= STEP_DEG; }
      while (accum <= -STEP_DEG) { rotateStep(-1); accum += STEP_DEG; }
      ev.preventDefault();
    }, {passive:false});

    wheel.addEventListener('touchend', () => { dragging = false; }, {passive:false});
    wheel.addEventListener('touchcancel', () => { dragging = false; }, {passive:false});
  }

  function bind() {
    const tap = (node, fn) => {
      node.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); fn(); });
      node.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); fn(); }, { passive:false });
    };

    tap(el.btnMenu, goMenu);
    tap(el.btnPrev, moveUp);
    tap(el.btnNext, moveDown);
    tap(el.btnCenter, select);
    tap(el.btnCheck, toggleCheck);

    bindWheelRotation();

    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'ArrowUp') { e.preventDefault(); moveUp(); }
      else if (k === 'ArrowDown') { e.preventDefault(); moveDown(); }
      else if (k === 'Enter') { e.preventDefault(); select(); }
      else if (k === 'Escape') { e.preventDefault(); goBack(); }
      else if (k === ' ') { e.preventDefault(); toggleCheck(); }
    });

    window.addEventListener('online', () => setTimeout(checkOnline, 300));
    window.addEventListener('offline', () => setTimeout(checkOnline, 300));
  }

  // ===== 초기화 =====
  function tick() { el.clock.textContent = fmtClock(); }

  bind();
  tick();
  setInterval(tick, 1000 * 10);

  window.addEventListener('load', () => {
    startOnlineMonitor();
    refreshAll();
  });
})();
</script>
<script>
/**
 * ✅ 메뉴 터치/클릭을 강제로 살림 (이벤트 위임)
 * - 메뉴 항목(li, button, a, div 등) 무엇이든 텍스트로 판별해서 동작
 * - ipod.js가 내부적으로 키보드/휠 이벤트만 받는 경우에도 터치로 트리거 가능
 */
(function () {
  const pickAction = (el) => {
    const t = (el?.innerText || el?.textContent || "").trim().toLowerCase();
    if (!t) return null;
    if (t.includes("tracks")) return "tracks";
    if (t.includes("ranking")) return "ranking";
    if (t.includes("hot")) return "hot_ranking";
    if (t.includes("runs")) return "runs";
    return null;
  };

  const fireKey = (key) => window.dispatchEvent(new KeyboardEvent("keydown", { key }));
  const fireEnter = () => fireKey("Enter");

  document.addEventListener("click", (e) => {
    const item = e.target.closest("li, button, a, [role='menuitem'], .menu-item, .item");
    if (!item) return;
    const action = pickAction(item);
    if (!action) return;

    // ipod.js가 선택 이동 후 Enter로 확정하는 방식이라면:
    // 1) 해당 항목을 선택 상태로 만들고(클래스 있을 때)
    // 2) Enter를 쏴줌
    try {
      // 선택 클래스가 있다면 강제 부여 (있어도/없어도 무해)
      document.querySelectorAll(".selected, .active").forEach(x => x.classList.remove("selected", "active"));
      item.classList.add("selected", "active");
    } catch {}

    fireEnter();
  }, { passive: true });

  document.addEventListener("touchstart", (e) => {
    const item = e.target.closest("li, button, a, [role='menuitem'], .menu-item, .item");
    if (!item) return;
    const action = pickAction(item);
    if (!action) return;
    // iOS에서 touchstart가 click보다 안정적이라 여기서도 Enter 트리거
    try {
      document.querySelectorAll(".selected, .active").forEach(x => x.classList.remove("selected", "active"));
      item.classList.add("selected", "active");
    } catch {}
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
  }, { passive: true });
})();
</script>
</body>
</html>
